[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jolt"
version = "2.0.0"
description = "Agentic RAG research assistant: LangGraph agent with hybrid retrieval, self-grading, query rewriting and web fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "K Mohammed Hamza" }]
keywords = ["rag", "llm", "agents", "langgraph", "faiss", "fastapi"]
dependencies = [
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
    "typer>=0.12",
    "httpx>=0.27",
    "openai>=1.30",
    "ddgs>=9.0",
]

[project.optional-dependencies]
# Local GPU inference with GGUF models (build with CMAKE_ARGS="-DGGML_CUDA=on" for CUDA).
local = ["llama-cpp-python>=0.2.80"]
# Neural embeddings and cross-encoder reranking.
embeddings = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
jolt = "jolt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jolt"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI/Typer use function calls in argument defaults by design

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
