# Full stack: Ollama (LLM) + Jolt API + Streamlit UI.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:3b
#   docker compose exec api jolt ingest data/sample
# Then open http://localhost:8501
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment to use an NVIDIA GPU (needs the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    depends_on:
      - ollama
    environment:
      JOLT_LLM_BACKEND: openai
      JOLT_OPENAI_BASE_URL: http://ollama:11434/v1
      JOLT_LLM_MODEL: qwen2.5:3b
    volumes:
      - index:/app/data/index
      - hf-cache:/app/.cache/huggingface
    ports:
      - "8000:8000"

  ui:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -q streamlit httpx && streamlit run ui/streamlit_app.py --server.address 0.0.0.0"
    environment:
      JOLT_API_URL: http://api:8000
    volumes:
      - ./ui:/app/ui:ro
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  ollama:
  index:
  hf-cache:
